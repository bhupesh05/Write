<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Tomato TV Remote</title>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        body { background-color: #1a1a1a; font-family: sans-serif; text-align: center; margin: 0; padding: 15px; color: white; }
        .card { background: #2a2a2a; padding: 15px; border-radius: 10px; margin-bottom: 15px; box-shadow: 0 4px 6px rgba(0,0,0,0.3); border: 1px solid #444; }
        input[type="text"], select { padding: 12px; width: calc(100% - 24px); margin-bottom: 10px; border: 1px solid #555; border-radius: 5px; background: #111; color: white; font-size: 16px; }
        button { padding: 15px; width: 100%; font-size: 16px; border: none; border-radius: 8px; font-weight: bold; margin-bottom: 10px; cursor: pointer; }
        .btn-primary { background: #ff6347; color: white; }
        .btn-nav { background: #444; color: white; }
        .remote-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; }
        .color-btns { display: grid; grid-template-columns: repeat(4, 1fr); gap: 5px; margin-top: 10px; }
        .btn-red { background: red; color: white; }
        .btn-green { background: green; color: white; }
        .btn-yellow { background: yellow; color: black; }
        .btn-blue { background: blue; color: white; }
        .btn-thinq { background: #9c27b0; color: white; grid-column: span 3; }
        #touchpad { width: 100%; height: 200px; background: #111; color: #aaa; border-radius: 8px; touch-action: none; display: flex; align-items: center; justify-content: center; margin-bottom: 10px; border: 1px dashed #777; font-size: 16px; font-weight: bold; }
        .status-on { color: #00ffcc; font-weight: bold; }
        .status-off { color: #ff4d4d; font-weight: bold; }
    </style>
</head>
<body>
    <h3>🍅 Tomato TV Remote</h3>
    
    <div class="card">
        <div>TV Status: <span id="conn" class="status-off">CONNECTING...</span></div>
    </div>

    <div class="card">
        <label style="font-size: 14px; display:block; text-align:left; margin-bottom:5px;">M3U History & Link:</label>
        <select id="m3u-history" onchange="selectHistoryLink()">
            <option value="">-- Select from History --</option>
        </select>
        <input type="text" id="m3u-input" placeholder="Paste or type M3U URL...">
        <button class="btn-primary" onclick="sendPlaylist()">Load M3U to TV</button>
    </div>

    <div class="card">
        <div id="touchpad">🖱️ TOUCHPAD (Swipe to Move Cursor)</div>
        <div class="remote-grid" style="margin-bottom: 8px;">
            <button class="btn-nav" onclick="sendCmd('vol_up')">Vol +</button>
            <button class="btn-nav" onclick="sendCmd('ch_up')">CH ▲</button>
            <button class="btn-nav" onclick="sendCmd('back')">Back</button>
            <button class="btn-nav" onclick="sendCmd('vol_down')">Vol -</button>
            <button class="btn-nav" onclick="sendCmd('ch_down')">CH ▼</button>
            <button class="btn-nav" onclick="sendCmd('ok')">OK</button>
        </div>
        <button class="btn-thinq" onclick="sendCmd('thinq')">🎙️ ThinQ AI Interaction</button>
        <div class="color-btns">
            <button class="btn-red" onclick="sendCmd('red')">Settings</button>
            <button class="btn-green" onclick="sendCmd('green')">Test</button>
            <button class="btn-yellow" onclick="sendCmd('yellow')">Working</button>
            <button class="btn-blue" onclick="sendCmd('blue')">All Lists</button>
        </div>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const tvId = urlParams.get('tv');
        let connection = null;

        let m3uHistory = JSON.parse(localStorage.getItem('tomato_phone_m3u_history')) || [];
        updateHistoryUI();

        function updateHistoryUI() {
            const select = document.getElementById('m3u-history');
            select.innerHTML = '<option value="">-- Select from History --</option>';
            m3uHistory.forEach(link => {
                let opt = document.createElement('option');
                opt.value = link;
                opt.innerText = link.length > 40 ? link.substring(0, 37) + '...' : link;
                select.appendChild(opt);
            });
        }

        function selectHistoryLink() {
            const val = document.getElementById('m3u-history').value;
            if(val) document.getElementById('m3u-input').value = val;
        }

        if (!tvId) {
            document.getElementById('conn').innerText = 'ERROR: NO TV ID IN URL';
        } else {
            // Optimized Peer connection with explicit signaling servers
            const peer = new Peer({ debug: 2 });
            
            peer.on('open', () => {
                connection = peer.connect(tvId, { reliable: true });
                
                connection.on('open', () => {
                    document.getElementById('conn').innerText = 'CONNECTED';
                    document.getElementById('conn').className = 'status-on';
                });

                connection.on('error', (err) => {
                    document.getElementById('conn').innerText = 'CONNECTION ERROR';
                });

                connection.on('close', () => {
                    document.getElementById('conn').innerText = 'DISCONNECTED';
                    document.getElementById('conn').className = 'status-off';
                });
            });

            peer.on('error', (err) => {
                document.getElementById('conn').innerText = 'PEER ERROR: ' + err.type;
            });
        }

        const send = (type, payload) => {
            if (connection && connection.open) {
                connection.send({ type, payload });
            }
        };

        function sendCmd(cmd) {
            send('cmd', { command: cmd });
        }

        let lastX = 0, lastY = 0;
        const pad = document.getElementById('touchpad');
        
        pad.addEventListener('touchstart', e => {
            lastX = e.touches[0].clientX;
            lastY = e.touches[0].clientY;
            send('touch', { state: 'start', x: lastX, y: lastY });
        });

        pad.addEventListener('touchmove', e => {
            let currentX = e.touches[0].clientX;
            let currentY = e.touches[0].clientY;
            let deltaX = currentX - lastX;
            let deltaY = currentY - lastY;
            lastX = currentX;
            lastY = currentY;
            send('touch', { state: 'move', dx: deltaX, dy: deltaY });
        });

        pad.addEventListener('touchend', () => send('touch', { state: 'end' }));
        pad.addEventListener('click', () => sendCmd('ok'));

        function sendPlaylist() {
            const url = document.getElementById('m3u-input').value.trim();
            if(!url) return alert('Please enter or select an M3U link.');
            if(!m3uHistory.includes(url)) {
                m3uHistory.unshift(url);
                if(m3uHistory.length > 10) m3uHistory.pop();
                localStorage.setItem('tomato_phone_m3u_history', JSON.stringify(m3uHistory));
                updateHistoryUI();
            }
            send('load_m3u', { url: url });
            alert('M3U playlist sent to Tomato TV.');
        }
    </script>
</body>
</html>
