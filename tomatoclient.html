<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Tomato TV Remote</title>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        body { background-color: #1a1a1a; font-family: sans-serif; text-align: center; margin: 0; padding: 15px; color: white; }
        .card { background: #2a2a2a; padding: 15px; border-radius: 10px; margin-bottom: 15px; box-shadow: 0 4px 6px rgba(0,0,0,0.3); border: 1px solid #444; text-align: left; }
        input[type="text"], select { padding: 12px; width: calc(100% - 24px); margin-bottom: 10px; border: 1px solid #555; border-radius: 5px; background: #111; color: white; font-size: 16px; box-sizing: border-box; }
        button { padding: 15px; width: 100%; font-size: 16px; border: none; border-radius: 8px; font-weight: bold; margin-bottom: 10px; cursor: pointer; box-sizing: border-box; }
        .btn-primary { background: #ff6347; color: white; }
        .btn-nav { background: #444; color: white; }
        .btn-nav:active { background: #ff6347; }
        
        .remote-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; margin-bottom: 15px; }
        .color-btns { display: grid; grid-template-columns: repeat(4, 1fr); gap: 5px; margin-top: 15px; }
        
        /* D-Pad specific Layout */
        .dpad-container { display: grid; grid-template-columns: 1fr 1.2fr 1fr; gap: 8px; max-width: 260px; margin: 0 auto 15px auto; }
        .dpad-blank { background: transparent; pointer-events: none; }
        .btn-dpad { background: #333; color: white; border-radius: 8px; font-size: 26px; padding: 25px 0; border: 2px solid #555; font-weight: bold; cursor: pointer; }
        .btn-dpad:active { background: #ff6347; border-color: white; }
        .btn-dpad-ok { background: #ff6347; border-radius: 50%; color: white; font-size: 20px; }

        .btn-red { background: red; color: white; }
        .btn-green { background: green; color: white; }
        .btn-yellow { background: yellow; color: black; }
        .btn-blue { background: blue; color: white; }
        .btn-thinq { background: #9c27b0; color: white; grid-column: span 3; }
        
        .phone-log { background: #050505; border: 1px solid #333; border-radius: 6px; padding: 10px; font-family: monospace; font-size: 14px; color: #00ffcc; height: 120px; overflow-y: auto; line-height: 1.4; }
        .status-on { color: #00ffcc; font-weight: bold; }
        .status-off { color: #ff4d4d; font-weight: bold; }
    </style>
</head>
<body>
    <h3 style="text-align: center;">🍅 Tomato TV Remote</h3>

    <div class="card" style="text-align: center;">
        <div>TV Status: <span id="conn" class="status-off">CONNECTING...</span></div>
    </div>

    <!-- D-Pad Directional Controller -->
    <div class="card" style="text-align: center;">
        <div class="dpad-container">
            <div class="dpad-blank"></div>
            <button class="btn-dpad" onclick="sendCmd('up')">▲</button>
            <div class="dpad-blank"></div>
            
            <button class="btn-dpad" onclick="sendCmd('left')">◀</button>
            <button class="btn-dpad btn-dpad-ok" onclick="sendCmd('ok')">OK</button>
            <button class="btn-dpad" onclick="sendCmd('right')">▶</button>
            
            <div class="dpad-blank"></div>
            <button class="btn-dpad" onclick="sendCmd('down')">▼</button>
            <div class="dpad-blank"></div>
        </div>

        <div class="remote-grid">
            <button class="btn-nav" onclick="sendCmd('vol_up')">Vol +</button>
            <button class="btn-nav" onclick="sendCmd('back')" style="background: #222;">Back / Prev</button>
            <button class="btn-nav" onclick="sendCmd('ch_up')">CH ▲</button>
            
            <button class="btn-nav" onclick="sendCmd('vol_down')">Vol -</button>
            <button class="btn-nav" onclick="sendCmd('thinq')" style="background: #9c27b0;">🎙️ ThinQ</button>
            <button class="btn-nav" onclick="sendCmd('ch_down')">CH ▼</button>
        </div>

        <div class="color-btns">
            <button class="btn-red" onclick="sendCmd('red')">Settings</button>
            <button class="btn-green" onclick="sendCmd('green')">Category</button>
            <button class="btn-yellow" onclick="sendCmd('yellow')">Favorite</button>
            <button class="btn-blue" onclick="sendCmd('blue')">All Lists</button>
        </div>
    </div>

    <div class="card">
        <label style="font-size: 14px; display:block; margin-bottom:5px;">Send Custom M3U Link:</label>
        <select id="m3u-history" onchange="selectHistoryLink()">
            <option value="">-- Select from History --</option>
        </select>
        <input type="text" id="m3u-input" placeholder="Paste or type M3U URL...">
        <button class="btn-primary" onclick="sendPlaylist()">Load M3U to TV</button>
    </div>

    <div class="card">
        <label style="font-size: 14px; display:block; margin-bottom:5px;">📱 Phone Debug Terminal:</label>
        <div id="phone-log" class="phone-log"></div>
    </div>

    <script>
        const logBox = document.getElementById('phone-log');
        function phoneLog(msg) {
            const time = new Date().toLocaleTimeString();
            logBox.innerHTML += `<div>[${time}] ${msg}</div>`;
            logBox.scrollTop = logBox.scrollHeight;
        }

        const urlParams = new URLSearchParams(window.location.search);
        const tvId = urlParams.get('tv');
        let connection = null;

        let m3uHistory = JSON.parse(localStorage.getItem('tomato_phone_m3u_history')) || [];
        updateHistoryUI();

        function updateHistoryUI() {
            const select = document.getElementById('m3u-history');
            select.innerHTML = '<option value="">-- Select from History --</option>';
            m3uHistory.forEach(link => {
                let opt = document.createElement('option');
                opt.value = link;
                opt.innerText = link.length > 40 ? link.substring(0, 37) + '...' : link;
                select.appendChild(opt);
            });
        }

        function selectHistoryLink() {
            const val = document.getElementById('m3u-history').value;
            if(val) document.getElementById('m3u-input').value = val;
        }

        if (!tvId) {
            phoneLog("ERROR: No TV ID found in URL parameters.");
            document.getElementById('conn').innerText = 'ERROR: NO TV ID';
        } else {
            phoneLog(`Initializing Peer connection to TV ID: ${tvId}`);

            const peer = new Peer({
                config: {
                    iceServers: [
                        { urls: 'stun:stun.l.google.com:19302' }
                    ]
                }
            });

            peer.on('open', () => {
                phoneLog("Peer client active. Connecting to TV session...");
                connection = peer.connect(tvId, { reliable: true });

                connection.on('open', () => {
                    phoneLog("Successfully connected to TV WebRTC host!");
                    document.getElementById('conn').innerText = 'CONNECTED';
                    document.getElementById('conn').className = 'status-on';
                });

                connection.on('data', (incoming) => {
                    if (incoming.type === 'log') {
                        phoneLog(`[TV LOG]: ${incoming.payload.message}`);
                    }
                });

                connection.on('error', (err) => {
                    phoneLog(`Connection error: ${err}`);
                    document.getElementById('conn').innerText = 'CONNECTION ERROR';
                });

                connection.on('close', () => {
                    phoneLog("Connection closed by TV host.");
                    document.getElementById('conn').innerText = 'DISCONNECTED';
                    document.getElementById('conn').className = 'status-off';
                });
            });

            peer.on('error', (err) => {
                phoneLog(`PeerJS Error [${err.type}]: ${err.message}`);
                document.getElementById('conn').innerText = 'PEER ERROR';
            });
        }

        const send = (type, payload) => {
            if (connection && connection.open) {
                connection.send({ type, payload });
            } else {
                phoneLog("Warning: Tried to send command while disconnected.");
            }
        };

        function sendCmd(cmd) {
            phoneLog(`Sending command: ${cmd}`);
            send('cmd', { command: cmd });
        }

        function sendPlaylist() {
            const url = document.getElementById('m3u-input').value.trim();
            if(!url) return alert('Please enter or select an M3U link.');
            if(!m3uHistory.includes(url)) {
                m3uHistory.unshift(url);
                if(m3uHistory.length > 10) m3uHistory.pop();
                localStorage.setItem('tomato_phone_m3u_history', JSON.stringify(m3uHistory));
                updateHistoryUI();
            }
            phoneLog(`Transmitting M3U playlist link...`);
            send('load_m3u', { url: url });
        }
    </script>
</body>
</html>
